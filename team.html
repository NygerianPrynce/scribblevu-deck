<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScribbleVu Team</title>
<meta name="description" content="James Ramundo and Fadhil Lawal, the team behind ScribbleVu.">
<style>
  @font-face { font-family: "Caveat"; font-weight: 700; src: url(fonts/caveat-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "Nunito"; font-weight: 900; src: url(fonts/nunito-latin-900-normal.woff2) format("woff2"); }
  :root { --paper: #FAF8F3; --grid: #DCE3EC; --grid-major: #C9D3E0; --ink: #2B3A67; --blue: #4F6BED; --quiet: #6B7591; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px;
    padding: 64px 16px; color: var(--ink); font-family: "Nunito", system-ui, sans-serif;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid-major) 1px, transparent 1px), linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
      linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 200px 200px, 200px 200px, 40px 40px, 40px 40px;
  }
  .brand { font: 700 56px/1 "Caveat", cursive; }
  .brand b { color: var(--blue); font-weight: 700; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 56px; }
  .polaroid { position: relative; width: min(340px, 82vw); padding: 18px 18px 14px; background: #fff;
    box-shadow: 0 30px 50px -24px rgba(43,58,103,.5), 0 0 0 1px rgba(43,58,103,.08); transform: rotate(var(--r)); }
  .polaroid img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
  .polaroid .nm { margin-top: 12px; text-align: center; font: 700 44px/1 "Caveat", cursive; }
  .tape { position: absolute; left: 50%; top: -18px; width: 130px; height: 36px; margin-left: -65px; background: rgba(255,255,255,.65);
    transform: rotate(-3deg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
</style>
</head>
<body>
  <div class="brand">Scribble<b>Vu</b></div>
  <div class="row">
    <div class="polaroid" style="--r:-3deg"><div class="tape"></div><img src="assets/team_james.jpg?v=2" alt="James Ramundo"><div class="nm">James Ramundo</div></div>
    <div class="polaroid" style="--r:2.5deg"><div class="tape"></div><img src="assets/team_fadhil.jpg?v=2" alt="Fadhil Lawal"><div class="nm">Fadhil Lawal</div></div>
  </div>
</body>
</html>
